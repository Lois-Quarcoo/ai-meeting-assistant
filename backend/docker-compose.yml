services:

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-meeting-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env                       # loads your .env automatically
    environment:
      - NODE_ENV=production
      # Override MONGO_URI to point to the local mongo service
      - MONGO_URI=mongodb://mongo:27017/ai-meeting-assistant
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - meeting-net
    volumes:
      - uploads:/app/uploads        # persist any uploaded files

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    container_name: ai-meeting-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"               # exposed so you can connect with Compass
    volumes:
      - mongo-data:/data/db         # persists data between container restarts
    networks:
      - meeting-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local
  uploads:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  meeting-net:
    driver: bridge
